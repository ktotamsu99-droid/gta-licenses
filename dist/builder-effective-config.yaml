directories:
  output: dist
  buildResources: build
appId: com.gta.licenses
productName: GTA Licenses
copyright: 2026 Elliot Holland
files:
  - filter:
      - main.js
      - updater.js
      - preload.js
      - laws.html
      - auth.html
      - generator.html
      - package.json
      - node_modules/electron-log/**/*
      - node_modules/electron-updater/**/*
win:
  target: portable
  compression: maximum
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: GTA Licenses
  uninstallDisplayName: GTA Licenses Overlay
  artifactName: GTA_Licenses_Setup_${version}.exe
portable:
  artifactName: GTA_Licenses_Portable_${version}.exe
publish:
  provider: github
  owner: ElliotHolland
  repo: gta-licenses
  releaseType: release
electronVersion: 28.3.3
